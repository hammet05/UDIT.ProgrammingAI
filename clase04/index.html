<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riesgo cardíaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f8; --card: #ffffff; --ink: #14222b; --muted: #5b6b75;
    --line: #d5dee3; --accent: #0e6e7e; --accent-ink: #ffffff;
    --low: #2e7d4f; --mid: #b7791f; --high: #b3261e;
    --track: #e3eaee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a20; --card: #17262e; --ink: #e8f0f3; --muted: #9db0ba;
      --line: #2a3d47; --accent: #4fb3c4; --accent-ink: #0f1a20;
      --low: #5cc489; --mid: #e0a64a; --high: #ef7a72; --track: #243640;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Public Sans", system-ui, "Segoe UI", sans-serif;
    line-height: 1.5; padding: 32px 16px;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }
  .layout { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; align-items: start; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-weight: 500; font-size: .92rem; margin-bottom: 4px; }
  .hint { color: var(--muted); font-weight: 400; }
  input, select {
    width: 100%; padding: 9px 10px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .field { margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    width: 100%; padding: 11px; font: inherit; font-weight: 700; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .result { min-height: 260px; display: flex; flex-direction: column; justify-content: center; }
  .empty { color: var(--muted); text-align: center; }
  .pct { font-size: 4rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
  .level { font-size: 1.15rem; font-weight: 700; margin: 6px 0 18px; }
  .scale { position: relative; height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, var(--low) 0 35%, var(--mid) 35% 65%, var(--high) 65% 100%); }
  .marker { position: absolute; top: -5px; width: 4px; height: 22px; background: var(--ink);
    border-radius: 2px; transform: translateX(-2px); transition: left .5s ease; }
  .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; margin-top: 6px; }
  .explain { margin: 18px 0 0; }
  .note { color: var(--muted); font-size: .82rem; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .error { color: var(--high); font-weight: 500; }
  .low { color: var(--low); } .mid { color: var(--mid); } .high { color: var(--high); }
  @media (prefers-reduced-motion: reduce) { .marker { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Estimador de riesgo cardíaco</h1>
  <p class="sub">Introduce los datos del paciente y el modelo estimará la probabilidad de enfermedad cardíaca.</p>

  <div class="layout">
    <form class="panel" id="form">
      <div class="row">
        <div class="field"><label for="age">Edad</label><input id="age" type="number" min="1" max="110" value="63" required></div>
        <div class="field"><label for="resting_bp">Presión en reposo <span class="hint">mmHg</span></label><input id="resting_bp" type="number" min="60" max="260" value="160" required></div>
      </div>
      <div class="row">
        <div class="field"><label for="cholesterol">Colesterol <span class="hint">mg/dl</span></label><input id="cholesterol" type="number" min="80" max="600" value="250" required></div>
        <div class="field"><label for="max_heart_rate">Pulso máximo <span class="hint">lpm</span></label><input id="max_heart_rate" type="number" min="60" max="240" value="140" required></div>
      </div>
      <div class="row">
        <div class="field"><label for="st_depression">Depresión ST</label><input id="st_depression" type="number" step="0.1" min="0" max="10" value="2.3" required></div>
        <div class="field"><label for="exercise_angina">Angina al ejercicio</label>
          <select id="exercise_angina"><option value="0">No</option><option value="1" selected>Sí</option></select></div>
      </div>
      <button type="submit" id="btnCalcular">Calcular riesgo</button>
      <button style ="margin-top: 10px; background-color:cornflowerblue;" type="button" id="btnBorrar" onclick="borrar()">Borrar</button>
    </form>

    <section class="panel result" id="result" aria-live="polite">
      <p class="empty">El resultado aparecerá aquí.</p>
    </section>
  </div>
</main>

<script>
const form = document.getElementById("form");
const result = document.getElementById("result");
const btn = document.getElementById("btnCalcular");
const btnBorrar = document.getElementById("btnBorrar");


function nivel(p) {
  if (p < 0.35) return { clase: "low", texto: "Riesgo bajo", msg: "Los datos se parecen a los de pacientes sin enfermedad cardíaca." };
  if (p < 0.65) return { clase: "mid", texto: "Riesgo intermedio", msg: "El modelo no ve un patrón claro hacia ningún lado." };
  return { clase: "high", texto: "Riesgo alto", msg: "Los datos se parecen a los de pacientes con enfermedad cardíaca." };
};

function borrar() {
    document.getElementById("age").value="";
    document.getElementById("resting_bp").value="";
    document.getElementById("cholesterol").value="";
    document.getElementById("max_heart_rate").value="";
    document.getElementById("st_depression").value="";
    document.getElementById("exercise_angina").value="";
}


form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    age: parseInt(age.value), resting_bp: parseInt(resting_bp.value),
    cholesterol: parseInt(cholesterol.value), max_heart_rate: parseInt(max_heart_rate.value),
    exercise_angina: parseInt(exercise_angina.value), st_depression: parseFloat(st_depression.value)
  };

  btn.disabled = true; btn.textContent = "Calculando…";

  try {
    const res = await fetch("/predict", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error("La API respondió con el código " + res.status);

    const data = await res.json();
    const n = nivel(data.probabilidad);
    const pct = Math.round(data.probabilidad * 1000) / 10;

    result.innerHTML = `
      <div class="pct ${n.clase}">${pct}%</div>
      <div class="level ${n.clase}">${n.texto}</div>
      <div class="scale"><div class="marker" id="marker" style="left:0%"></div></div>
      <div class="ticks"><span>0%</span><span>35%</span><span>65%</span><span>100%</span></div>
      <p class="explain">${n.msg}</p>
      <p class="note">Estimación estadística del modelo </p>`;
    requestAnimationFrame(() => { document.getElementById("marker").style.left = pct + "%"; });
  } catch (err) {
    result.innerHTML = `<p class="error">No se pudo calcular el riesgo. ${err.message}. Comprueba que el contenedor está en marcha.</p>`;
  } finally {
    btn.disabled = false; btn.textContent = "Calcular riesgo";
  }
});
</script>
</body>
</html>
